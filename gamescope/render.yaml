services:
  - type: web
    name: gamescope
    runtime: node
    plan: free
    rootDir: gamescope
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
